<!doctype html>
<!-- Throwaway portfolio prototype: selected Home layout, Films, and About. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tower Lady Pictures — Independent short films from Poland</title>
  <link rel="stylesheet" href="portfolio.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="index.html" aria-label="Tower Lady Pictures, home" aria-current="page">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="wordmark" aria-hidden="true">
        <span>Tower Lady</span>
        <span class="wordmark-detail">Pictures</span>
      </span>
    </a>
    <nav aria-label="Main navigation">
      <a href="films.html">Films</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="main" class="wrap">
    <section class="home-hero">
      <div class="home-intro">
        <h1><span>Independent short</span> <span>films from Poland.</span></h1>
        <p>Named for the legend of Halszka<br class="desktop-break"> and her tower in Szamotuły.</p>
        <a class="button" href="films.html">Explore films</a>
      </div>
      <div class="home-art" aria-hidden="true">
        <img src="assets/brand-reference.png" width="1487" height="1058" alt="">
      </div>
    </section>

    <section class="film-strip" aria-labelledby="short-films">
      <h2 id="short-films">Short films</h2>
      <div class="film-grid">
        <a class="film-tile" href="films.html#boundless">
          <img src="assets/boundless.jpg" width="1280" height="720" alt="">
          <span>Boundless, actually</span>
        </a>
        <a class="film-tile" href="films.html#akabei">
          <img src="assets/akabei.jpg" width="1280" height="720" alt="">
          <span>Akabei</span>
        </a>
        <a class="film-tile" href="films.html#saturday-cleaning">
          <span class="saturday-art" aria-hidden="true">
            <img src="assets/brand-reference.png" width="1487" height="1058" alt="">
          </span>
          <span>Saturday cleaning</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">Tower Lady Pictures</footer>
</body>
</html>
